apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvm-api
  labels:
    app: kvm-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kvm-api
  template:
    metadata:
      labels:
        app: kvm-api
    spec:
      containers:
        - name: kvm-api
          image: kvm-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kvm-api
spec:
  selector:
    app: kvm-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
