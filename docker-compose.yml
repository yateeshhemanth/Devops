version: '3.9'
services:
  api:
    build:
      context: ./backend
    ports:
      - "8080:8080"
  ui:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - VITE_API_BASE=http://localhost:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api
